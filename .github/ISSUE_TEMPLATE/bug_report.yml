name: Bug report
description: Report a reproducible defect in Hardenix
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private hostnames, IP addresses, logs with credentials, or other sensitive server data.
  - type: input
    id: version
    attributes:
      label: Hardenix version or commit
      placeholder: "0.1.0 or commit hash"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the module/action and sanitized commands or inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
