name: CI

on:
  push:
    branches: [main, master, refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: python -m compileall -q main.py core modules workflow templates tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check packaged entry points and modules
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("hardenix-*.whl"))
          with ZipFile(wheel) as package:
              names = set(package.namelist())
          required = {
              "main.py",
              "modules/registry.py",
              "modules/ssh.py",
              "modules/fail2ban.py",
              "modules/network.py",
              "modules/timezone.py",
              "modules/system_update.py",
              "templates/module_template.py",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing required files: {sorted(missing)}")
          PY
